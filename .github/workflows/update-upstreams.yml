name: Update upstream skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update and verify skills
        run: ./scripts/update.sh --no-global

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-upstream-skills
          delete-branch: true
          commit-message: "chore: update upstream skills"
          title: "chore: update upstream skills"
          body: |
            Automated weekly update of pinned skill repositories.

            The update script rebuilt `enabled/` and verified every configured `SKILL.md` and symlink.
